<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Blog - JuanFlix</title>
  
  <link href="assets/img/logo juanflix.png" rel="icon">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">

  <style>
      /* Estilo extra para paginación activa */
      .blog-pagination ul li a.active {
          background-color: var(--juanflix-green, #46d369);
          color: white;
          border-color: var(--juanflix-green, #46d369);
      }
      .blog-pagination ul li a {
          cursor: pointer; /* Mano al pasar el mouse */
      }
      .disabled {
          pointer-events: none;
          opacity: 0.5;
      }
  </style>
</head>

<body class="blog-page">

  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid position-relative d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
        <h1 class="sitename">JUANFLIX</h1>
      </a>
      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="blog.html" class="active">Blog</a></li>
          <li><a class="cta-btn align-middle" href="registro.html">Regístrate</a></li>
          <li><a class="cta-btn align-middle" href="iniciarsesion.html">Iniciar sesión</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="page-title dark-background">
      <div class="container">
        <h1>Blog de Cine</h1>
        <nav class="breadcrumbs">
          <ol><li><a href="index.html">Inicio</a></li><li class="current">Blog</li></ol>
        </nav>
      </div>
    </div>

    <section id="blog-posts" class="blog-posts section">
      <div class="container">
        <!-- AQUÍ SE INYECTAN LOS POSTS -->
        <div class="row gy-4" id="blogContainer"></div>
      </div>
    </section>

    <!-- PAGINACIÓN DINÁMICA -->
    <section id="blog-pagination" class="blog-pagination section">
      <div class="container">
        <div class="d-flex justify-content-center">
          <ul id="paginationList">
            <!-- JavaScript llenará esto: < 1 2 3 > -->
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer" class="footer dark-background">
    <div class="footer-newsletter">
      <div class="container">
        <div class="row justify-content-center text-center">
          <div class="col-lg-6">
            <h4>Suscríbete a nuestro Newsletter</h4>
            <p>Recibe las últimas noticias sobre Películas y Series</p>
            <form id="newsletterForm" class="php-email-form">
              <div class="newsletter-form"><input type="email" name="email" required><input type="submit" value="Suscribirse"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="container copyright text-center mt-4">
      <p>© <span>Copyright</span> <strong class="px-1 sitename">JUANFLIX</strong></p>
    </div>
  </footer>

  <!-- Modal Suscripción -->
  <div class="modal fade" id="suscritoModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-4 text-center bg-dark">
        <h4 class="mb-3 text-white">¡Suscripción Exitosa!</h4>
        <p class="text-white">Gracias por unirte.</p>
        <button type="button" class="btn btn-success" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  
  <!-- IMPORTAR DATOS Y LOGICA -->
  <script src="datos_blog.js"></script>
  
  <script>
      // CONFIGURACIÓN
      const itemsPerPage = 6; // Cuántas noticias por página
      let currentPage = 1;
      
      const blogContainer = document.getElementById('blogContainer');
      const paginationList = document.getElementById('paginationList');

      // Función para mostrar las noticias de la página X
      function displayPosts(page) {
          blogContainer.innerHTML = "";
          currentPage = page;

          // Calcular índices
          const start = (page - 1) * itemsPerPage;
          const end = start + itemsPerPage;
          
          // Cortar el array de noticias
          const paginatedPosts = blogPosts.slice(start, end);

          paginatedPosts.forEach(post => {
              const html = `
                <div class="col-lg-4">
                    <article>
                        <div class="post-img">
                            <img src="${post.image}" alt="${post.title}" class="img-fluid" style="width:100%; height:250px; object-fit:cover;">
                        </div>
                        <p class="post-category">${post.category}</p>
                        <h2 class="title">
                            <a href="blog-details.html?id=${post.id}">${post.title}</a>
                        </h2>
                        <p class="post-summary text-muted small">${post.summary}</p>
                        <div class="d-flex align-items-center mt-3">
                            <img src="${post.authorImg}" alt="" class="img-fluid post-author-img flex-shrink-0">
                            <div class="post-meta">
                                <p class="post-author">${post.author}</p>
                                <p class="post-date"><time>${post.date}</time></p>
                            </div>
                        </div>
                    </article>
                </div>
              `;
              blogContainer.innerHTML += html;
          });

          updatePagination();
          window.scrollTo(0, 0); // Subir al inicio al cambiar página
      }

      // Función para crear los botones de paginación
      function updatePagination() {
          paginationList.innerHTML = "";
          const totalPages = Math.ceil(blogPosts.length / itemsPerPage);

          // Botón Anterior (<)
          const prevClass = currentPage === 1 ? "disabled" : "";
          paginationList.innerHTML += `<li><a class="${prevClass}" onclick="displayPosts(${currentPage - 1})"><i class="bi bi-chevron-left"></i></a></li>`;

          // Botones de Números (1, 2, 3...)
          for (let i = 1; i <= totalPages; i++) {
              const activeClass = currentPage === i ? "active" : "";
              paginationList.innerHTML += `<li><a class="${activeClass}" onclick="displayPosts(${i})">${i}</a></li>`;
          }

          // Botón Siguiente (>)
          const nextClass = currentPage === totalPages ? "disabled" : "";
          paginationList.innerHTML += `<li><a class="${nextClass}" onclick="displayPosts(${currentPage + 1})"><i class="bi bi-chevron-right"></i></a></li>`;
      }

      // Newsletter Logic
      document.getElementById("newsletterForm").addEventListener("submit", function (e) {
        e.preventDefault();
        new bootstrap.Modal(document.getElementById('suscritoModal')).show();
        this.reset();
      });

      // INICIAR
      displayPosts(1);

  </script>

</body>
</html>
