<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuanFlix - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        body { background-color: #000000; font-family: 'Arial', sans-serif; }
        .login-container { color: white; }
        .login-form-wrapper { max-width: 450px; width: 100%; }

        .form-control-dark {
            background-color: #121212; color: #ffffff; border: 1px solid #535353; height: 48px;
        }
        .form-control-dark:focus {
            background-color: #121212; color: #ffffff; border-color: #1ed760; box-shadow: 0 0 0 0.25rem rgba(30, 215, 96, 0.25);
        }
        .btn-spotify-green {
            background-color: #1ed760; border-color: #1ed760; color: #000000; text-transform: uppercase; border-radius: 10px; transition: 0.2s;
        }
        .btn-spotify-green:hover { background-color: #1fdf64; transform: scale(1.02); }
        .text-white-50 { color: #a7a7a7 !important; }
        
        .input-group-password { position: relative; }
        .toggle-password {
            height: 48px; width: 48px; display: flex; align-items: center; justify-content: center;
            position: absolute; right: 0; top: 0; color: #a7a7a7; cursor: pointer; z-index: 10;
        }
        .toggle-password:hover { color: #ffffff; }
        #passwordMismatchFeedback { display: none; color: #dc3545; margin-top: 0.25rem; font-size: 0.875em; }
        .terms-link { color: #1ed760 !important; text-decoration: none; }
        .terms-link:hover { text-decoration: underline !important; }

        /* Clase para ocultar los inputs trampa */
        .ghost-input { position: absolute; left: -9999px; opacity: 0; }
    </style>
</head>

<body class="bg-black">

    <div class="login-container d-flex flex-column justify-content-center align-items-center min-vh-100 p-3">

        <div class="login-form-wrapper p-4 p-md-5 mx-auto">

            <div class="text-center">
                <img src="assets/img/logo juanflix.png" alt="Logo" class="img-fluid mb-3" style="max-width: 200px;">
            </div>
            <h1 class="text-center text-white fw-bold mb-4">Crea tu Cuenta</h1>

            <form class="needs-validation" id="registrationForm" novalidate autocomplete="off">
                
                <!-- 1. TRUCO DE INPUTS FANTASMA (El navegador rellenará esto y dejará los reales en paz) -->
                <input type="text" name="fakeusernameremembered" class="ghost-input">
                <input type="password" name="fakepasswordremembered" class="ghost-input">

                <div class="mb-3">
                    <label for="emailInput" class="form-label text-white-50">Correo electrónico</label>
                    <input type="email" id="emailInput" name="emailInput" class="form-control form-control-dark" required autocomplete="off">
                    <div class="invalid-feedback">Ingresa un correo válido.</div>
                </div>

                <div class="mb-3">
                    <label for="usernameInput" class="form-label text-white-50">Nombre de Usuario</label>
                    <input type="text" id="usernameInput" name="usernameInput" class="form-control form-control-dark" required minlength="4" autocomplete="off">
                    <div class="invalid-feedback">Mínimo 4 caracteres.</div>
                </div>

                <div class="mb-3">
                    <label for="passwordInput" class="form-label text-white-50">Contraseña</label>
                    <div class="input-group-password">
                        <!-- 2. TRUCO READONLY: Se quita al hacer clic (onfocus) -->
                        <input type="password" id="passwordInput" name="passwordInput" 
                            class="form-control form-control-dark pe-5" 
                            required minlength="6" 
                            autocomplete="new-password"
                            readonly 
                            onfocus="this.removeAttribute('readonly');">
                        <span class="toggle-password" id="togglePassword"><i class="fas fa-eye"></i></span>
                        <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmPasswordInput" class="form-label text-white-50">Confirmar Contraseña</label>
                    <div class="input-group-password">
                        <!-- 2. TRUCO READONLY AQUI TAMBIÉN -->
                        <input type="password" id="confirmPasswordInput" name="confirmPasswordInput" 
                            class="form-control form-control-dark pe-5" 
                            required 
                            autocomplete="new-password"
                            readonly 
                            onfocus="this.removeAttribute('readonly');">
                        <span class="toggle-password" id="toggleConfirmPassword"><i class="fas fa-eye"></i></span>
                        <div class="invalid-feedback">Confirma tu contraseña.</div>
                        <div id="passwordMismatchFeedback">⚠️ Las contraseñas no coinciden.</div>
                    </div>
                </div>

                <div class="legal-notice text-center mt-4 mb-4">
                    <div class="form-check d-inline-block">
                        <input class="form-check-input" type="checkbox" name="terms" id="termsCheckbox" required>
                        <label class="form-check-label text-white-50" for="termsCheckbox">
                            Acepto los <a href="terminos.html" class="terms-link fw-bold">Términos y Condiciones</a>
                        </label>
                        <div class="invalid-feedback">Debes aceptar los términos.</div>
                    </div>
                </div>

                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-spotify-green fw-bold py-2">Registrarse</button>
                </div>

                <div class="d-flex align-items-center mb-4">
                    <hr class="flex-grow-1 border-white-50">
                    <span class="mx-3 text-white">o</span>
                    <hr class="flex-grow-1 border-white-50">
                </div>
            </form>

            <div class="text-center mt-5">
                <p class="text-white-50 mb-1">¿Ya tienes cuenta?</p>
                <a href="iniciarsesion.html" class="text-white fw-bold text-decoration-underline-hover">Inicia Sesión</a>
            </div>
            <hr class="flex-grow-1 border-white-50">
            <br>
            <div class="d-grid mb-4 text-left">
                <a href="index.html" class="btn btn-spotify-green fw-bold">Inicio</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/b0373c612a.js" crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            const form = document.getElementById('registrationForm');
            const passwordInput = document.getElementById('passwordInput');
            const confirmPasswordInput = document.getElementById('confirmPasswordInput');
            const passwordMismatchFeedback = document.getElementById('passwordMismatchFeedback');
            const termsCheckbox = document.getElementById('termsCheckbox');
            
            // Función Mostrar/Ocultar
            function setupPasswordToggle(toggleId, inputId) {
                const input = document.getElementById(inputId);
                const toggle = document.getElementById(toggleId);
                const icon = toggle ? toggle.querySelector('i') : null;

                if (toggle && input && icon) {
                    toggle.addEventListener('click', function () {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    });
                }
            }

            setupPasswordToggle('togglePassword', 'passwordInput');
            setupPasswordToggle('toggleConfirmPassword', 'confirmPasswordInput');

            // Verificación de Contraseña
            function checkPasswordMatch() {
                const passwordValue = passwordInput.value;
                const confirmPasswordValue = confirmPasswordInput.value;
                
                if (confirmPasswordValue.length > 0) {
                    if (passwordValue !== confirmPasswordValue) {
                        passwordMismatchFeedback.style.display = 'block';
                        confirmPasswordInput.setCustomValidity("Las contraseñas no coinciden");
                    } else {
                        passwordMismatchFeedback.style.display = 'none';
                        confirmPasswordInput.setCustomValidity(""); 
                    }
                } else {
                    passwordMismatchFeedback.style.display = 'none';
                    confirmPasswordInput.setCustomValidity("");
                }
                
                if (form.classList.contains('was-validated')) {
                     confirmPasswordInput.reportValidity();
                }
            }

            passwordInput.addEventListener('input', checkPasswordMatch);
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);

            // Términos
            termsCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    this.setCustomValidity("");
                } else {
                    this.setCustomValidity("Debes aceptar los Términos y Condiciones.");
                }
                if (form.classList.contains('was-validated')) {
                    this.reportValidity();
                }
            });

            // Envío
            form.addEventListener('submit', function (event) {
                checkPasswordMatch();
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    event.preventDefault(); 
                    alert("¡Cuenta Registrada Exitosamente!");
                    window.location.href = "plataforma.html"; 
                }
                form.classList.add('was-validated');
            }, false);
        });
    </script>

</body>
</html>
