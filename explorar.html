<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>JUANFLIX - Explorar Catálogo</title>
    <!-- Tus links CSS siguen igual... -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- ESTILOS (Los mismos que ya tenías, resumidos aquí) -->
    <style>
        :root { --juanflix-bg: #141414; --juanflix-card: #1f1f1f; --juanflix-green: #46d369; --text-main: #ffffff; --text-muted: #b3b3b3; }
        body { background-color: var(--juanflix-bg); color: var(--text-main); font-family: 'Montserrat', sans-serif; padding-top: 80px; }
        a { text-decoration: none; color: white; transition: 0.3s; }
        a:hover { color: var(--juanflix-green); }
        .navbar { background-color: #0b0b0b; padding: 15px 4%; border-bottom: 1px solid #222; }
        .navbar-brand { font-weight: 800; font-size: 1.8rem; letter-spacing: 1px; color: white !important; }
        .nav-link { color: #e5e5e5 !important; font-weight: 500; margin-right: 15px; }
        .nav-link:hover, .nav-link.active { color: white !important; font-weight: 700; }
        .nav-link.active { color: var(--juanflix-green) !important; }
        .explore-header { padding: 40px 4% 20px 4%; text-align: center; }
        .search-container { position: relative; max-width: 600px; margin: 0 auto 30px auto; }
        .search-input { width: 100%; background-color: #222; border: 1px solid #333; color: white; padding: 15px 20px 15px 50px; border-radius: 50px; font-size: 1.1rem; }
        .search-input:focus { outline: none; border-color: var(--juanflix-green); background-color: #000; }
        .search-icon-input { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .genre-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .genre-btn { background: transparent; border: 1px solid #444; color: var(--text-muted); padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .genre-btn:hover, .genre-btn.active { background-color: var(--juanflix-green); color: black; border-color: var(--juanflix-green); font-weight: 600; }
        .content-section { padding: 0 4% 60px 4%; min-height: 50vh; }
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 25px; border-left: 4px solid var(--juanflix-green); padding-left: 15px; }
        .movie-card { background: transparent; border: none; position: relative; transition: transform 0.3s ease; cursor: pointer; margin-bottom: 30px; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .movie-card:hover { transform: translateY(-10px); z-index: 10; }
        .poster-container { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 2/3; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
        .poster-img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .movie-card:hover .poster-img { filter: brightness(0.6); }
        .card-hover-info { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; padding: 10px; text-align: center; }
        .movie-card:hover .card-hover-info { opacity: 1; }
        .hover-btn { background-color: var(--juanflix-green); color: black; border: none; padding: 8px 16px; border-radius: 50px; font-weight: bold; margin-top: 10px; }
        .hover-btn:hover { background-color: white; }
        .movie-title { font-size: 1rem; font-weight: 700; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        .no-results { text-align: center; padding: 50px; color: var(--text-muted); }
        #scroll-top { position: fixed; right: 20px; bottom: 20px; z-index: 9999; width: 50px; height: 50px; font-size: 24px; border-radius: 50%; background-color: #28a745; border: 3px solid #218838; color: white; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease-in-out; }
        #scroll-top:hover { background-color: #218838; border-color: #1e7e34; }

    .user-avatar-nav {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      margin-left: 20px;
    }
    </style>
</head>
<body>
    <!-- HEADER Y NAVBAR (Igual que antes) -->
    <header id="header" class="fixed-top">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="plataforma.html">JUANFLIX</a>
                <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-4">
                        <li class="nav-item"><a class="nav-link" href="plataforma.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="movie.html">Películas</a></li>
                        <li class="nav-item"><a class="nav-link" href="serie.html">Series</a></li>
                        <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                        <li class="nav-item"><a class="nav-link active" href="explorar.html">Explorar</a></li>
                    </ul>

                    <div class="d-flex align-items-center nav-icons">
                        <a href="explorar.html">
                        <div class="dropdown">
                            <a href="#" role="button" data-bs-toggle="dropdown">
                                <img src="https://cdn.id.supercell.com/assets/web/portraits/0,chicken,FF6100,EDD566.png"
                                    alt="Perfil" class="user-avatar-nav">
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end mt-3">
                                <li><a class="dropdown-item" href="perfil.html">Mi Perfil</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="index.html">Cerrar Sesión</a></li>
                            </ul>
                        </div>
                    </div>



                </div>

                


            </div>


                
        </nav>
    </header>

    

    <main>
        <section class="explore-header">
            <h2 class="mb-4 fw-bold">¿Qué vas a criticar hoy?</h2>
            <div class="search-container">
                <i class="bi bi-search search-icon-input"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Títulos, géneros...">
            </div>
            <div class="genre-filters">
                <button class="genre-btn active" data-category="Todo">Todo</button>
                <button class="genre-btn" data-category="Pelicula">Películas</button>
                <button class="genre-btn" data-category="Serie">Series</button>
                <button class="genre-btn" data-category="Terror">Terror</button>
                <button class="genre-btn" data-category="Comedia">Comedia</button>
                <button class="genre-btn" data-category="Acción">Acción</button>
                <button class="genre-btn" data-category="Anime">Anime</button>
                <button class="genre-btn" data-category="Drama">Drama</button>
                <button class="genre-btn" data-category="Sci-Fi">Ciencia Ficción</button>
                <button class="genre-btn" data-category="Romance">Romance</button>
            </div>
        </section>

        <section class="content-section">
            <h3 class="section-title" id="resultsTitle">Populares en Juanflix</h3>
            <div class="row" id="moviesContainer"></div>
        </section>
    </main>

    <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <!-- IMPORTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- IMPORTANTE: Importamos la base de datos externa -->
    <script src="peliculas.js"></script>

    <script>
        const container = document.getElementById('moviesContainer');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.genre-btn');
        const resultsTitle = document.getElementById('resultsTitle');

        function renderMovies(data) {
            container.innerHTML = '';
            if (data.length === 0) {
                container.innerHTML = `<div class="col-12 no-results"><h4>No encontramos nada.</h4></div>`;
                return;
            }

            data.forEach((movie) => {
                // TRUCO DE MAGIA: Usamos el ID de la peli para el enlace
                // Nota la ruta: RESEÑA-HTML/reseña.html?id=...
                // Buscamos el index real en la base de datos completa para no perdernos al filtrar
                const originalIndex = moviesDB.indexOf(movie); 
                const linkDestino = `RESEÑA-HTML/reseña.html?id=${originalIndex}`;

                const categoriesText = Array.isArray(movie.category) ? movie.category.join(' / ') : movie.category;

                const cardHTML = `
                    <div class="col-6 col-md-4 col-lg-3 col-xl-2">
                        <div class="movie-card" onclick="window.location.href='${linkDestino}'">
                            <div class="poster-container">
                                <img src="${movie.img}" class="poster-img" alt="${movie.title}">
                                <div class="card-hover-info">
                                    <i class="bi bi-play-circle-fill fs-1 text-white"></i>
                                    <button class="hover-btn">Ver Reseña</button>
                                </div>
                            </div>
                            <h5 class="movie-title">${movie.title}</h5>
                            <div class="movie-meta">
                                <span style="font-size: 0.75rem;">${categoriesText}</span>
                                <span><i class="bi bi-star-fill text-warning"></i> ${movie.rating}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Lógica de Filtros (Igual que antes)
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const category = btn.getAttribute('data-category');
                
                if (category === 'Todo') {
                    renderMovies(moviesDB);
                    resultsTitle.innerText = "Populares en Juanflix";
                } else {
                    const filtered = moviesDB.filter(m => m.category.includes(category) || m.type === category);
                    renderMovies(filtered);
                    resultsTitle.innerText = `Resultados: ${category}`;
                }
            });
        });

        // Lógica de Búsqueda
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = moviesDB.filter(m => 
                m.title.toLowerCase().includes(searchTerm) || 
                m.category.some(cat => cat.toLowerCase().includes(searchTerm))
            );
            renderMovies(filtered);
        });

        // Inicializar
        renderMovies(moviesDB);
    </script>
</body>
</html>
